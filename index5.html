<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Мадияр, IT студенті және frontend әзірлеуші. Визитка сайты.">
<title>Мадияр | Business Card Website</title>
<style>
:root{--bg:#dfe8ff;--card:#fff;--ink:#14173a;--mut:#555a85;--acc:#3b5bfd;--line:#14173a;--chip:#eef1ff}
@media (prefers-color-scheme:dark){:root{--bg:#10132b;--card:#1a1e45;--ink:#eef0ff;--mut:#a4a9d6;--acc:#8ea2ff;--line:#8ea2ff;--chip:#252a5c}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Arial,sans-serif}
.card{width:min(460px,100%);background:var(--card);border:3px solid var(--line);border-radius:22px;box-shadow:10px 10px 0 var(--line);padding:30px 28px}
.top{display:flex;align-items:center;gap:16px}
.ava{width:76px;height:76px;border-radius:20px;background:var(--acc);color:#fff;display:grid;place-items:center;font:800 34px Georgia,serif;flex-shrink:0}
h1{margin:0;font-size:28px;line-height:1.1;letter-spacing:-.5px}
.role{margin:4px 0 0;color:var(--mut)}
.about{margin:22px 0}
h2{margin:0 0 10px;font-size:15px;color:var(--mut)}
.skills{display:flex;gap:10px;flex-wrap:wrap;list-style:none;margin:0 0 24px;padding:0}
.skills li{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:12px;padding:6px 12px 6px 6px;font-weight:600}
.skills img{width:28px;height:28px}
.links{display:grid;gap:10px}
.links a{display:block;text-align:center;padding:12px;border:2px solid var(--line);border-radius:12px;color:var(--ink);text-decoration:none;font-weight:700}
.links a:first-child{background:var(--acc);color:#fff;border-color:var(--line)}
.links a:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--line)}
a:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
footer{margin-top:22px;font-size:13px;color:var(--mut);text-align:center}
@media (prefers-reduced-motion:no-preference){.links a{transition:transform .12s,box-shadow .12s}}
</style>
</head>
<body>
<main class="card">
  <header class="top">
    <div class="ava" aria-hidden="true">М</div>
    <div>
      <h1>Мадияр</h1>
      <p class="role">Frontend әзірлеуші, IT студенті</p>
    </div>
  </header>
  <section class="about">
    <p>Қ. Жұбанов атындағы Ақтөбе өңірлік университетінің 2 курс студентімін. Сайттар жасаймын, HTML, CSS және JavaScript үйреніп жатырмын.</p>
  </section>
  <section>
    <h2>Қолданатын құралдар</h2>
    <ul class="skills">
      <li><img src="css.svg" alt="">CSS</li>
      <li><img src="git.svg" alt="">Git</li>
      <li><img src="python.svg" alt="">Python</li>
      <li><img src="vs.svg" alt="">VS Code</li>
    </ul>
  </section>
  <nav class="links" aria-label="Байланыс">
    <a href="https://github.com/USERNAME">GitHub</a>
    <a href="https://t.me/USERNAME">Telegram</a>
    <a href="mailto:you@example.com">Email жазу</a>
  </nav>
  <footer>© 2026 Мадияр</footer>
</main>
</body>
</html>
